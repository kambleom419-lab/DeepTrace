# The DeepTrace stack.
#
#   docker compose up -d --build     build the image and start everything
#   docker compose ps                check health
#   docker compose logs -f worker    watch the worker claim jobs
#   docker compose down              stop (data survives in the named volumes)
#   docker compose down -v           stop and DELETE all data
#
# Services talk over the compose network by service name - `postgres` and `moto` - which is
# why the container endpoints use those hostnames and the host-run setup uses 127.0.0.1.
# Nothing else about the configuration differs.

name: deeptrace

x-app-environment: &app_environment
  DATABASE_URL: postgresql+psycopg://deeptrace:deeptrace@postgres:5432/deeptrace
  # S3 holds the video and the heatmaps; SQS carries the job messages. In AWS neither needs
  # an endpoint or a key, because the ECS task role supplies the credentials - which is why
  # there is no secret here to leak. Locally both point at Moto, one port for both services.
  STORAGE_BACKEND: s3
  S3_BUCKET: deeptrace
  S3_REGION: us-east-1
  S3_ENDPOINT_URL: http://moto:5000
  # Dummy credentials. Moto accepts any string; they are here only because boto3 insists on
  # being given something once there is no task role to fall back on.
  S3_ACCESS_KEY: testing
  S3_SECRET_KEY: testing
  QUEUE_BACKEND: sqs
  QUEUE_NAME: jobs
  # Long polling: an idle worker then makes 3 SQS requests a minute instead of 60, which is
  # the difference between living inside the free tier and spending the credit on nothing.
  QUEUE_WAIT_SECONDS: "20"
  # To run this stack against the Azure backends instead - both are still supported, and both
  # pass the same suite - start azurite with `--profile azure` and swap the block above for
  # STORAGE_BACKEND=azure / STORAGE_CONTAINER=deeptrace / STORAGE_CONNECTION=<Azurite
  # connection string> / QUEUE_BACKEND=azure. backend/.env.example has the literal string.
  # In the containers inference is never in the API process: that is the worker's job, so
  # the two scale independently. This is the difference from the local dev setup.
  WORKER_IN_PROCESS: "false"
  ANALYSIS_MODE: ${ANALYSIS_MODE:-real}
  REQUIRE_WEIGHTS: "true"
  JWT_SECRET: ${JWT_SECRET:-local-dev-only-not-a-real-secret-please-change-in-the-cloud}

services:
  postgres:
    image: postgres:17-alpine
    container_name: deeptrace-postgres
    environment:
      POSTGRES_USER: deeptrace
      POSTGRES_PASSWORD: deeptrace   # local only; Azure uses a Container Apps secret
      POSTGRES_DB: deeptrace
    ports:
      - "5433:5432"   # 5432 on the host is already this machine's own PostgreSQL
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deeptrace -d deeptrace"]
      interval: 5s
      timeout: 5s
      retries: 12

  # Azurite is Microsoft's storage emulator: Blob, Queue and Table in one container. It sits
  # behind a profile, so a plain `docker compose up` does not start it - the default stack is
  # the AWS one. Start it with `docker compose --profile azure up -d`. The well-known account
  # name and key below are published in Microsoft's docs and are NOT secrets; they only ever
  # work against the emulator.
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    container_name: deeptrace-azurite
    profiles: ["azure"]
    # --skipApiVersionCheck: the Azure SDKs ship newer REST API versions than Azurite knows,
    # and without this it rejects them with "API version not supported by Azurite".
    command: >
      azurite
      --silent
      --blobHost 0.0.0.0
      --queueHost 0.0.0.0
      --location /data
      --skipApiVersionCheck
    ports:
      - "10000:10000"   # blob  - videos and heatmaps
      - "10001:10001"   # queue - job messages
      - "10002:10002"   # table - unused
    volumes:
      - azurite-data:/data

  # Moto is the local stand-in for S3 and SQS. It is the third kind of emulator in this
  # file, and the reason for it is boring: MinIO deleted its community Docker images in
  # 2026, and LocalStack's image now refuses to start without an account-bound auth token.
  # Moto needs no account, no token and no signup, and covers both services in one
  # container - which is why it is the pragmatic choice for a project that must stay free.
  #
  # It holds state in memory, so `docker compose restart moto` empties every bucket and
  # queue. That only matters if you restart it mid-session; the database would keep rows
  # pointing at bytes that no longer exist, so reset both together (`down -v`).
  moto:
    image: motoserver/moto:latest
    container_name: deeptrace-moto
    ports:
      - "5000:5000"   # S3 and SQS on one endpoint
    environment:
      MOTO_PORT: 5000

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: deeptrace-app:local   # shared with the worker: one image, two commands
    init: true                   # reap zombies and forward SIGTERM properly
    environment: *app_environment
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      moto:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5).status == 200 else 1)"
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  # No ports: nothing connects to the worker, it only pulls jobs off the queue. In AWS this
  # is the ECS service that scales on queue depth.
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: deeptrace-app:local
    init: true
    command: ["python", "-m", "app.worker"]
    environment: *app_environment
    depends_on:
      postgres:
        condition: service_healthy
      moto:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres-data:
  azurite-data:
