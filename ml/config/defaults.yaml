# DeepTrace ML — default configuration
# Override any value via ml/detection/config/env or the CLI flags.

# ── data ─────────────────────────────────────────────────────
data:
  dataset_root: ""        # set to your FF++/Celeb-DF/DFDC folder (or env DATASET_ROOT)
  train_split: 0.8
  seed: 42
  face_size: 224          # aligned crop size
  frame_budget: 8         # frames sampled per video (V1 CPU budget)
  num_workers: 0          # 0 on Windows avoids DataLoader spawn issues

# ── video preprocessing ──────────────────────────────────────
video:
  fps_cap: 30
  ffmpeg_bin: ""          # default: rely on PATH (or env FFMPEG_BIN)

# ── backbone (spatial) ───────────────────────────────────────
backbone:
  name: xception           # xception | convnext_tiny (timm ids)
  weights: imagenet        # timm pretrained source
  train_backbone: false    # freeze by default (CPU budget); unfreeze last block via finetune

spatial:
  dropout: 0.3
  # trained output lives here:
  checkpoint: weights/spatial_xception.pt

# ── temporal (GRU over frame features) ───────────────────────
temporal:
  hidden: 128
  layers: 1
  dropout: 0.3
  checkpoint: weights/temporal_gru.pt

# ── frequency (FFT/DCT stats -> MLP) ─────────────────────────
frequency:
  hidden: 64
  checkpoint: weights/frequency_mlp.pt

# ── fusion (concat features -> MLP) ──────────────────────────
fusion:
  hidden: 64
  dropout: 0.3
  checkpoint: weights/fusion_mlp.pt

# ── thresholds ───────────────────────────────────────────────
thresholds:
  fake: 0.6               # p >= fake  -> LIKELY_MANIPULATED
  real: 0.4               # p <= real  -> LIKELY_AUTHENTIC  (between -> INCONCLUSIVE)
  suspicious: 0.5         # frame-level flag for heatmaps / segments
  heatmap_top_k: 3        # max Grad-CAM frames to render

# ── training ─────────────────────────────────────────────────
training:
  epochs:
    spatial: 6
    temporal: 10
    frequency: 30
    fusion: 20
  batch_size: 16
  lr: 0.001
  lr_finetune: 0.0001
  weight_decay: 0.0005
  log_interval: 10
